[build]
  command = "pip install -r requirements.txt && python generate_site.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.9"
  # Build from the committed CSVs in data/ — Airtable was retired as the build
  # source (2026-07-20) when the paid plan was dropped and the Veterinarians
  # table data was deleted. This toml value overrides any dashboard env var,
  # so a stale DATA_SOURCE=airtable in the Netlify UI can never wipe the site.
  DATA_SOURCE = "csv"

[[redirects]]
  from = "/search"
  to = "/search/index.html"
  status = 200

[[redirects]]
  from = "/vets"
  to = "/vets/index.html"
  status = 200

[[redirects]]
  from = "/specialties"
  to = "/specialties/index.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/submit"
  to = "/submit/index.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

# --- 301 redirects: .html URLs → extensionless canonical URLs ---
# force=true is required; without it Netlify serves the .html file directly
# and bypasses the redirect, leaving duplicate URLs indexable.

[[redirects]]
  from = "/vet/*.html"
  to = "/vet/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/vets/*.html"
  to = "/vets/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/specialty/*.html"
  to = "/specialty/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*.html"
  to = "/blog/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/submit.html"
  to = "/submit"
  status = 301
  force = true

[[redirects]]
  from = "/search.html"
  to = "/search"
  status = 301
  force = true

# 301 redirects for fixed blog slugs (typos in original slugs)
[[redirects]]
  from = "/blog/hiropractic-care-for-pets/"
  to = "/blog/chiropractic-care-for-pets/"
  status = 301

[[redirects]]
  from = "/blog/hiropractic-care-for-pets/*"
  to = "/blog/chiropractic-care-for-pets/"
  status = 301

[[redirects]]
  from = "/blog/aturopathic-vs-holistic-vet-differences/"
  to = "/blog/naturopathic-vs-holistic-vet-differences/"
  status = 301

[[redirects]]
  from = "/blog/aturopathic-vs-holistic-vet-differences/*"
  to = "/blog/naturopathic-vs-holistic-vet-differences/"
  status = 301

[[redirects]]
  from = "/blog/nderstanding-tcvm-traditional-chinese-veterinary-medicine/"
  to = "/blog/understanding-tcvm-traditional-chinese-veterinary-medicine/"
  status = 301

[[redirects]]
  from = "/blog/nderstanding-tcvm-traditional-chinese-veterinary-medicine/*"
  to = "/blog/understanding-tcvm-traditional-chinese-veterinary-medicine/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
